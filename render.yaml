services:
  - type: web
    name: kin-prototype
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
